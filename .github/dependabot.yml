# Keeps the pinned actions and the NuGet packages up to date. The cooldown waits a week
# after each release, so a compromised version has time to be caught before we take it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Runs inside the .NET 10 SDK: version 11 needs the .NET 11 SDK.
      - dependency-name: Microsoft.NET.ILLink.Tasks
        update-types: ["version-update:semver-major"]
      # Kept on the .NET line of the bundled runtime; the next major comes with the move
      # to that .NET version.
      - dependency-name: System.*
        update-types: ["version-update:semver-major"]
