name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Weekly: picks up .NET security patches in the bundled runtime, and fails if a
  # vulnerability has been published for a package we use.
  schedule:
    - cron: "0 6 * * 3"

# Read-only by default; only the release job below gets more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # lets SignPath fetch the files to sign
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # Two ways to sign, each skipped until configured (see README): your own certificate
      # (SIGNING_CERT_PFX_BASE64 secret), or SignPath Foundation's free one for open source
      # (SIGNPATH_API_TOKEN secret and SIGNPATH_* variables). Configure one, not both.
      CAN_SIGN: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
      USE_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      # Actions are pinned to a commit: a moved or hijacked tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # CI=true (set by GitHub) turns on locked restore and warnings-as-errors,
      # see Directory.Build.props.
      - name: Restore
        run: dotnet restore DriverUpdater.sln

      # A tag v1.2.3 sets the version; otherwise the one in DriverUpdater.csproj.
      - name: Version
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) }
                     else { dotnet msbuild src/DriverUpdater -getProperty:Version }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalide : '$version'" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build DriverUpdater.sln -c Release --no-restore

      - name: Test
        run: dotnet test DriverUpdater.sln -c Release --no-build

      # Every section of the window, rendered by the tests: the look can be checked from here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish
        run: dotnet publish src/DriverUpdater -c Release -p:PublishProfile=win-x64 "-p:Version=$env:APP_VERSION"

      - name: Sign the app
        if: env.CAN_SIGN == 'true'
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./build/sign.ps1 publish/DriverUpdater.exe

      - name: Upload the app for SignPath
        id: unsigned-app
        if: env.USE_SIGNPATH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-app
          path: publish/

      - name: Sign the app (SignPath)
        if: env.USE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish-signed

      - name: Use the signed app
        if: env.USE_SIGNPATH == 'true'
        run: |
          Remove-Item publish -Recurse -Force
          Rename-Item publish-signed publish

      - name: Installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$env:APP_VERSION" installer\DriverUpdater.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Sign the installer
        if: env.CAN_SIGN == 'true'
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./build/sign.ps1 "installer-out/DriverUpdater-Setup-$env:APP_VERSION.exe"

      - name: Upload the installer for SignPath
        id: unsigned-installer
        if: env.USE_SIGNPATH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-installer
          path: installer-out/

      - name: Sign the installer (SignPath)
        if: env.USE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer-signed

      - name: Use the signed installer
        if: env.USE_SIGNPATH == 'true'
        run: |
          Remove-Item installer-out -Recurse -Force
          Rename-Item installer-signed installer-out

      # Really installs into Program Files, runs the same setup again (the repair path), then
      # uninstalls; each step checks what it left behind.
      - name: Test the installer
        run: |
          $setup = "installer-out\DriverUpdater-Setup-$env:APP_VERSION.exe"
          $dir = "$env:ProgramFiles\Driver Updater"
          function Install($log) {
            Start-Process $setup -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log"
          }
          Install install.log
          if (-not (Test-Path "$dir\DriverUpdater.exe")) { Get-Content install.log; throw "L'exe n'a pas été installé dans Program Files." }
          if (-not (Test-Path "$dir\setup\DriverUpdater-Setup.exe")) { throw "La copie de l'installateur (bouton Modifier) manque." }
          Install repair.log
          if (-not (Test-Path "$dir\DriverUpdater.exe")) { Get-Content repair.log; throw "La réparation a perdu l'exe." }
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          # The uninstaller hands over to a copy of itself and returns at once: wait for that copy.
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\DriverUpdater.exe") { throw "La désinstallation a laissé l'exe en place." }
          if (Test-Path "$dir\setup") { throw "La désinstallation a laissé la copie de l'installateur." }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DriverUpdater-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DriverUpdater-Setup
          path: installer-out/
          if-no-files-found: error
          retention-days: 30

  # A tag v1.2.3 publishes a GitHub release: installer, portable zip, checksums, and a
  # provenance attestation proving the files were built by this workflow.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          cp artifacts/DriverUpdater-Setup/*.exe release/
          (cd artifacts/DriverUpdater-win-x64 && zip -qr "../../release/DriverUpdater-${version}-win-x64.zip" .)
          (cd release && sha256sum -- * > SHA256SUMS.txt)

      # Attestations need a public repository (or GitHub Enterprise for a private one).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: release/*

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --repo "$GITHUB_REPOSITORY" --title "Driver Updater $GITHUB_REF_NAME"
          --generate-notes --verify-tag
